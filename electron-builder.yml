appId: com.tadreeb.tms
productName: نظام التدريب
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
# asar disabled so the bundled Express server can read dist/ files reliably
# (serving static files from inside an asar archive is unreliable in production).
asar: false
win:
  target: portable
  signAndEditExecutable: false
mac:
  target: dir
electronDownload:
  version: 35.1.0
