appId: com.tadreeb.tms
productName: نظام التدريب
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
extraResources:
  # Safety copy used by electron/main.cjs if files are placed beside resources
  # instead of inside resources/app on some Windows packaging/extraction paths.
  - from: dist
    to: dist
    filter:
      - "**/*"
# Keep the app archived to reduce Windows portable startup time. The desktop UI
# now loads directly from dist/index.html; the localhost server is only the API
# and LAN fallback, so it no longer needs loose frontend files to boot.
asar: true
win:
  target: portable
  signAndEditExecutable: false
mac:
  target: dir
electronDownload:
  version: 35.1.0
